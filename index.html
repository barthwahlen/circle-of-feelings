<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle of Feelings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; }

/* ── Dark theme (default) ─────────────────────────────────────────────────── */
:root {
  --bg: #0f0f1a;
  --surface: rgba(255,255,255,0.06);
  --icon-btn-bg: rgba(0,0,0,0.25);
  --border: rgba(255,255,255,0.10);
  --text: rgba(255,255,255,0.88);
  --muted: rgba(255,255,255,0.32);
  --seg-border: rgba(0,0,0,0.55);
  --card-bg: rgba(18,18,32,0.70);
  --card-border: rgba(255,255,255,0.13);
  --menu-bg: rgba(14,14,28,0.96);
  --btn-hover: rgba(255,255,255,0.10);
  --tab-bg: rgba(255,255,255,0.07);
  --tab-active: rgba(255,255,255,0.13);
  --body-text: rgba(255,255,255,0.78);
  --caption: rgba(255,255,255,0.38);
  --link: rgba(160,190,255,0.85);
  --link-hover: #fff;
  --scrollbar: rgba(255,255,255,0.18);
  --strong: #fff;
  --sheet-handle: rgba(255,255,255,0.25);
  --pointer: rgba(255,255,255,0.92);
  --opt-text: rgba(255,255,255,0.62);
  --mobile-btn-bg: rgba(15,15,26,0.25);
  --mobile-btn-hover: rgba(15,15,26,0.35);
  color-scheme: dark;
  --peek-h: 144px;
  --font-body:    'DM Sans', sans-serif;
  --font-heading: 'Host Grotesk', sans-serif;
}

/* ── Light theme overrides ────────────────────────────────────────────────── */
html[data-theme="light"] {
  --bg: #f5f2ee;
  --surface: rgba(0,0,0,0.04);
  --icon-btn-bg: rgba(255,255,255,0.25);
  --border: rgba(0,0,0,0.10);
  --text: rgba(0,0,0,0.82);
  --muted: rgba(0,0,0,0.40);
  --seg-border: rgba(255,255,255,0.55);
  --card-bg: rgba(252,250,247,0.50);
  --card-border: rgba(0,0,0,0.10);
  --menu-bg: rgba(252,250,244,0.97);
  --btn-hover: rgba(0,0,0,0.06);
  --tab-bg: rgba(0,0,0,0.05);
  --tab-active: rgba(0,0,0,0.09);
  --body-text: rgba(0,0,0,0.68);
  --caption: rgba(0,0,0,0.38);
  --link: rgba(50,90,200,0.90);
  --link-hover: #000;
  --scrollbar: rgba(0,0,0,0.18);
  --strong: #000;
  --sheet-handle: rgba(0,0,0,0.18);
  --pointer: rgba(0,0,0,0.75);
  --opt-text: rgba(0,0,0,0.62);
  --mobile-btn-bg: rgba(245,242,238,0.25);
  --mobile-btn-hover: rgba(245,242,238,0.35);
  color-scheme: light;
}

html[lang="fa"] {
  --font-body:    'Vazirmatn', sans-serif;
  --font-heading: 'Vazirmatn', sans-serif;
}

body {
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0;
  gap: 0;
  font-family: var(--font-body);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}

header {
  text-align: center;
  margin-top: 16px;
  flex-shrink: 0;
  order: 3;
}
header h1 {
  font-family: var(--font-heading);
  font-size: 2.5rem;
  color: var(--text);
  letter-spacing: 1px;
  font-weight: 600;
}
header p {
  font-size: clamp(18px, 1.44vw, 21px);
  color: var(--muted);
  margin-top: 4px;
}

/* ── Wheel ── */
#wheel-frame {
  contain: layout;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100vmin;
  height: 100vmin;
}

#wheel {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 780px;
  height: 780px;
  transform: translate(-50%, -50%); /* scale & rotation applied inline by JS */
  transform-origin: center center;
  cursor: grab;
  touch-action: none;
}
#wheel.dragging { cursor: grabbing; }

#pointer {
  position: absolute;
  top: 50%;
  right: -2px;
  transform: translate(0, -50%);
  width: 0;
  height: 0;
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
  border-right: 18px solid var(--pointer);
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.4));
  z-index: 20;
  pointer-events: none;
}

#ifeel-circle {
  position: absolute;
  top: 50%; left: 50%;
  width: calc(144px * var(--wheel-scale, 1));
  height: calc(144px * var(--wheel-scale, 1));
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: #e8e6e2;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 20;
  transition: background 0.15s;
}
#ifeel-circle:hover { background: #dddbd7; }
html[data-theme="light"] #ifeel-circle { background: #f0eee9; }
html[data-theme="light"] #ifeel-circle:hover { background: #e8e6e2; }
html[data-theme="light"] .wheel-base { box-shadow: none !important; }
#ifeel-circle span {
  font-family: var(--font-heading);
  font-size: calc(18px * var(--wheel-scale, 1));
  font-weight: 600;
  color: #333;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.seg {
  position: absolute;
  inset: 0;
  transition: filter 0.14s ease, opacity 0.14s ease;
}
.seg:hover { filter: saturate(1.25) brightness(1.1); z-index: 4; }
.seg.hi    { filter: saturate(1.35) brightness(1.12) drop-shadow(0 0 8px rgba(0,0,0,0.4)); z-index: 5; }
.seg.dim   { opacity: 0.72; filter: saturate(0.6); }


/* Labels */
.lbl {
  position: absolute;
  pointer-events: none;
  white-space: nowrap;
  z-index: 12;
  line-height: 1;
  user-select: none;
}
.lbl.lc  { font-family: var(--font-heading); font-size: 17px; font-weight: 600; }
.lbl.lm  { font-family: var(--font-heading); font-size: 14px; font-weight: 500; letter-spacing: 0.2px; }
.lbl.lo  { font-family: var(--font-heading); font-size: 12px; font-weight: 400; letter-spacing: 0.1px; }

/* ── Fixed icon buttons (help + language) ── */
.icon-btn {
  position: fixed;
  top: 24px;
  width: 63px; height: 63px;
  border-radius: 50%;
  background: var(--icon-btn-bg);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: background 0.15s;
  z-index: 100;
  touch-action: manipulation; /* no double-tap zoom → no click delay on mobile */
  will-change: transform; /* own compositing layer so backdrop-filter works above overlays */
}
.icon-btn:hover { background: var(--btn-hover); }
.icon-btn svg { width: 35px; height: 35px; }
#help-btn  { right: 20px; font-size: 31px; font-family: var(--font-heading); }
#profile-btn { right: 95px; }
#profile-btn .dot {
  position: absolute;
  top: 12px; right: 12px;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--strong);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
#profile-btn.has-items .dot { opacity: 1; }
#theme-btn { left: 20px; top: auto; bottom: 24px; font-size: 22px; }
#spin-btn  { top: auto; bottom: 24px; right: 20px; }

/* ── Language switcher ── */
#lang-btn { left: 20px; }
#lang-btn.open { background: var(--btn-hover); }

#lang-menu {
  position: fixed;
  z-index: 2100;
  top: 107px; left: 20px;
  background: var(--menu-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 6px;
  min-width: 170px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.65);
  opacity: 0;
  transform: translateY(-6px) scale(0.97);
  transform-origin: top left;
  transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
  backdrop-filter: blur(16px);
}
#lang-menu.open {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

.lang-opt {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 12px;
  border-radius: 10px;
  border: none; background: none;
  font-family: var(--font-body);
  font-size: 18px; color: var(--opt-text);
  cursor: pointer; text-align: start;
  transition: background 0.12s, color 0.12s;
}
.lang-opt:hover { background: var(--tab-bg); color: var(--text); }
.lang-opt.active { color: var(--strong); font-weight: 400; }
.lang-check { margin-left: auto; opacity: 0; flex-shrink: 0; }
.lang-opt.active .lang-check { opacity: 1; }


/* ── Emotion link + animated arrow ── */
.emo-link {
  background: none; border: none; cursor: pointer;
  color: inherit; font: inherit;
  display: inline;
  padding: 0;
  transition: opacity 0.15s;
  text-decoration: none;
}
.emo-link:hover { opacity: 0.72; }

.arr-anim {
  display: inline-block;
  width: 1.4em;
  height: 1.1em;
  overflow: hidden;
  position: relative;
  vertical-align: -0.1em;
  margin-left: 2px;
}
.arr-anim .at {
  position: absolute;
  left: 0; top: 0;
  animation: arrow-cycle 3.6s linear infinite;
}
.arr-anim .at:nth-child(2) { display: none; }
@keyframes arrow-cycle {
  /*    0 –  100ms : appear               */
  0%    { transform: translateX(0);    opacity: 1; animation-timing-function: step-end; }
  /*  100 –  450ms : blink off (350ms)   */
  2.8%  {                              opacity: 0; animation-timing-function: step-end; }
  /*  450 –  600ms : blink on + hold     */
  12.5% { transform: translateX(0);    opacity: 1; animation-timing-function: ease-in; }
  /*  600 – 1100ms : slide out           */
  16.7% { transform: translateX(0);    opacity: 1; animation-timing-function: ease-in; }
  30.6% { transform: translateX(300%); opacity: 0; }
  /* 1100 – 3600ms : stay gone (2500ms) */
  100%  { transform: translateX(300%); opacity: 0; }
}
@keyframes arrowSlide { to { opacity: 1; } }

/* Wheel label when selected */
.lbl.sel {
  pointer-events: auto;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-color: rgba(0,0,0,0.35);
}
.lbl.sel:hover { opacity: 0.72; }
.lbl.sel .wheel-arr {
  display: inline;
  opacity: 0;
  animation: arrowSlide 0.5s 0.25s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

/* ── Emotion overlay ── */
/* ── Shared overlay backdrop ── */
/* Canvas blur: separate element so it never creates a stacking context
   on the overlay itself, which would break the card's own backdrop-filter */
#canvas-blur {
  position: fixed; inset: 0;
  backdrop-filter: blur(0px);
  -webkit-backdrop-filter: blur(0px);
  z-index: 1999;
  pointer-events: none;
  transition: backdrop-filter 0.3s ease, -webkit-backdrop-filter 0.3s ease;
}
#canvas-blur.active {
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

#overlay, #help-overlay, #profile-overlay {
  position: fixed; inset: 0;
  background: transparent;
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 2000; padding: 0 0 env(safe-area-inset-bottom, 0px) 0;
  opacity: 0;
  transition: opacity 0.22s ease;
}
#overlay.vis, #help-overlay.vis, #profile-overlay.vis { opacity: 1; }
#overlay[hidden], #help-overlay[hidden], #profile-overlay[hidden] { display: none; }

/* ── Shared overlay card shell ── */
#overlay-card, #help-card, #profile-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  max-height: min(92dvh, 900px);
  width: min(100vw, 640px);
  padding: 16px clamp(32px, 4vw, 64px) clamp(36px, 3.5vw, 56px);
  display: flex; flex-direction: column;
  position: relative; z-index: 1;
  color: var(--text);
  box-shadow: 0 -8px 24px rgba(0,0,0,0.18);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transform: translateY(calc(100% - 2px));
  transition: transform 0.38s cubic-bezier(0.34,1.56,0.64,1);
}
#overlay.vis #overlay-card,
#help-overlay.vis #help-card,
#profile-overlay.vis #profile-card { transform: translateY(0); }

/* Background extension: moves with the card's transform so it always
   fills the gap between the card's bottom edge and the viewport bottom
   when the card is dragged upward. No backdrop-filter here (it would be
   clipped by the card's transform stacking context) — just the background
   colour so the gap doesn't expose a hard edge. */
#overlay-card::after, #help-card::after, #profile-card::after {
  content: '';
  position: absolute;
  left: -1px; right: -1px; /* align with outside of card border */
  top: 100%;                /* starts exactly at the card's bottom edge */
  height: 200dvh;           /* extends well past the viewport in all cases */
  background: var(--card-bg);
  pointer-events: none;
}

/* Blur floor: a JS-created sibling element inside each overlay.
   height is 0 by default and updated by addSheetDrag during upward drag.
   Background is transparent — the ::after above handles the colour;
   this element only adds the blur layer via backdrop-filter (sampled
   from the overlay, which has no transform, so it correctly blurs the wheel). */
.blur-floor {
  position: absolute;
  bottom: env(safe-area-inset-bottom, 0px);
  left: 50%;
  transform: translateX(-50%);
  width: min(100vw, 640px);
  height: 0;
  background: transparent;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  pointer-events: none;
  z-index: 0;
}

/* ── Peek state: card peeks up showing just the title ── */
#overlay.peek {
  opacity: 1;
  pointer-events: none;    /* backdrop doesn't intercept clicks */
  background: transparent;
}
#overlay.peek #overlay-card {
  transform: translateY(calc(100% - var(--peek-h)));
  pointer-events: auto;
  cursor: pointer;
}

/* ── Sheet drag handle ── */
.sheet-handle {
  width: 40px; height: 4px;
  background: var(--sheet-handle);
  border-radius: 2px;
  margin: 0 auto 20px;
  flex-shrink: 0;
  cursor: grab;
  position: relative;
}
.sheet-handle::before {
  content: '';
  position: absolute;
  /* Full card width, 64 px tall — easy to grab on both mobile and desktop */
  top: -24px; bottom: -36px;
  left: -50vw; right: -50vw;
}
.sheet-handle:active { cursor: grabbing; }

/* ── Shared close button ── */

/* ── Shared scrollable body ── */
.overlay-body, .info-panel {
  overflow-y: auto; flex: 1;
  scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent;
}
.overlay-body::-webkit-scrollbar,
.info-panel::-webkit-scrollbar { width: 4px; }
.overlay-body::-webkit-scrollbar-thumb,
.info-panel::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

#overlay-bar { width: 44px; height: 4px; border-radius: 2px; margin-bottom: 22px; flex-shrink: 0; }


.overlay-body section { margin-bottom: clamp(18px, 2vw, 28px); }
.overlay-body section:last-child { margin-bottom: 0; }

/* ── Share button (bottom of overlay body) ─────────────────────────────────
   Copies location.href (which already carries ?lang=xx and #emotion-slug,
   so the recipient lands on the same emotion in the same language). */
.share-feeling-btn {
  display: block;
  width: 100%;
  margin: clamp(20px, 2.5vw, 32px) 0 0;
  padding: 14px 16px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: clamp(16px, 1.2vw, 18px);
  font-weight: 500;
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}
.share-feeling-btn:hover  { background: var(--btn-hover); }
.share-feeling-btn:active { background: var(--tab-active); }
.share-feeling-btn.copied {
  background: var(--tab-active);
  color: var(--strong);
  border-color: transparent;
}

/* ── Add-to-profile button (sits above share button in emotion overlay) ──── */
.add-feeling-btn {
  display: block;
  width: 100%;
  margin: clamp(20px, 2.5vw, 32px) 0 0;
  padding: 14px 16px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: clamp(16px, 1.2vw, 18px);
  font-weight: 500;
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}
.add-feeling-btn:hover  { background: var(--btn-hover); }
.add-feeling-btn:active { background: var(--tab-active); }
.add-feeling-btn.added {
  opacity: 0.55;
  cursor: not-allowed;
  background: var(--surface);
}
.add-feeling-btn.added:hover { background: var(--surface); }
.add-feeling-btn .full-msg {
  display: block;
  margin-top: 8px;
  font-size: clamp(13px, 1vw, 15px);
  font-weight: 400;
  color: var(--muted);
  opacity: 0;
  transition: opacity 0.2s;
  height: 0; overflow: hidden;
}
.add-feeling-btn.show-full .full-msg {
  opacity: 1;
  height: auto;
}

/* ── Profile overlay rows + empty state ──────────────────────────────────── */
.profile-empty {
  text-align: center;
  color: var(--muted);
  font-size: clamp(16px, 1.3vw, 19px);
  margin: clamp(40px, 6vw, 80px) 0;
}
.profile-list {
  display: flex; flex-direction: column;
  gap: 10px;
}
.profile-row {
  display: flex; align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--surface);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.profile-row:hover { background: var(--btn-hover); }
.profile-row:active { background: var(--tab-active); }
.profile-row .swatch {
  width: 22px; height: 22px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
}
.profile-row .name {
  flex: 1;
  font-size: clamp(16px, 1.3vw, 19px);
  font-weight: 500;
  color: var(--text);
}
.profile-row .remove {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 22px; line-height: 1;
  transition: background 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.profile-row .remove:hover { background: var(--btn-hover); color: var(--text); }

/* ── First-visit intro hint pill ────────────────────────────────────────────
   Shown once via localStorage flag; auto-dismisses on first pointer input.
   Sits just above the safe-area inset, centred, with the same theming
   tokens as the overlay card so it visually belongs to the same family. */
#intro-hint {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(20px, 4vw, 36px));
  transform: translateX(-50%) translateY(8px);
  z-index: 1500;            /* below overlays (2000), above wheel */
  padding: 12px 22px;
  border: 1px solid var(--card-border);
  border-radius: 999px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--text);
  font-family: var(--font-body);
  font-size: clamp(14px, 1.1vw, 16px);
  font-weight: 500;
  white-space: nowrap;
  max-width: calc(100vw - 32px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  pointer-events: none;     /* never blocks taps; first tap dismisses it via document listener */
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
#intro-hint.vis {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#intro-hint[hidden] { display: none; }

#overlay-card h3 {
  font-size: clamp(18px, 1.44vw, 21px); font-weight: 400;
  color: var(--caption); margin: 0 0 7px;
}
#overlay-card p {
  font-size: clamp(18px, 1.44vw, 21px); line-height: 1.35; margin: 0;
  color: var(--body-text);
}

/* ── Help overlay ── */

/* How panel */
#info-panel-how p {
  font-size: clamp(18px, 1.5vw, 21px); line-height: 1.35;
  color: var(--body-text);
  margin: 0 0 clamp(14px, 1.5vw, 22px);
}
#info-panel-how p:last-child { margin-bottom: 0; }

#help-card strong { color: var(--strong); font-weight: 400; }

/* ── Info overlay — tab bar ── */
#info-tabs {
  display: flex; gap: 4px;
  background: var(--tab-bg);
  border-radius: 14px; padding: 4px;
  margin-bottom: 28px; flex-shrink: 0;
}
.info-tab {
  flex: 1; padding: 9px 0;
  border: none; border-radius: 10px;
  background: none;
  color: var(--muted);
  font-family: var(--font-heading);
  font-size: clamp(15px, 1.25vw, 18px); font-weight: 600;
  letter-spacing: 0.6px; text-transform: lowercase;
  cursor: pointer;
  transition: background 0.16s, color 0.16s;
}
.info-tab:hover { color: var(--body-text); }
.info-tab.active {
  background: var(--tab-active);
  color: var(--strong); font-weight: 600;
}

/* ── Info overlay — tab panels ── */
.info-panel { display: none; }
.info-panel.active { display: block; }

/* About panel */
#info-panel-about p {
  font-size: clamp(17px, 1.44vw, 21px); line-height: 1.35;
  color: var(--body-text);
  margin: 0 0 clamp(13px, 1.4vw, 20px);
}
#info-panel-about p:last-child { margin-bottom: 0; }
#info-panel-about em { font-style: italic; color: var(--text); }
#info-panel-about .info-sig {
  margin-top: clamp(22px, 2.5vw, 36px);
  font-size: clamp(14px, 1.1vw, 17px);
  color: var(--caption);
  letter-spacing: 0.3px;
}
.info-subheading {
  font-family: var(--font-heading);
  font-size: clamp(17px, 1.44vw, 21px);
  font-weight: 600;
  color: var(--text);
  margin: clamp(24px, 2.5vw, 36px) 0 clamp(13px, 1.4vw, 20px);
}

/* More panel */
#info-panel-more .more-items {
  display: flex; flex-direction: column; gap: 18px;
}
#info-panel-more p {
  font-size: clamp(17px, 1.44vw, 21px); line-height: 1.35;
  color: var(--body-text);
  margin: 0;
}
#info-panel-more a {
  display: inline-block; margin-top: 4px;
  color: var(--link);
  font-size: clamp(17px, 1.44vw, 21px); letter-spacing: 0.2px;
  text-decoration: none;
  transition: color 0.14s;
}
#info-panel-more a:hover { color: var(--link-hover); text-decoration: underline; }


/* ── Shared card heading ── */
#overlay-title, #help-title, #profile-title {
  font-family: var(--font-heading);
  font-size: clamp(1.875rem, 2.75vw, 2.75rem); font-weight: 600;
  color: var(--strong); margin: 0 0 clamp(20px, 2.5vw, 34px);
  flex-shrink: 0;
}

/* ─── Mobile pointer (outside transformed frame) ─────────────────────────── */
#pointer-mobile {
  display: none;
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 0;
  height: 0;
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
  border-right: 18px solid var(--pointer);
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.4));
  z-index: 20;
  pointer-events: none;
}


/* ═══ MOBILE PORTRAIT — half-wheel layout ══════════════════════════════════ */
@media (max-width: 768px) and (orientation: portrait) {
  body { padding: 0; }

  /* Frame centred on the left viewport edge — right half visible */
  #wheel-frame {
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateX(-50%) translateY(-50%);
    width: 205vw;
    height: 205vw;
    flex: none;
    max-width: none;
    align-self: auto;
  }

  /* Original pointer hidden — viewport-fixed pointer takes over */
  #pointer { display: none; }
  #pointer-mobile { display: block; }

  /* "I feel…" rotated 90° and shifted right into the visible semicircle */
  #ifeel-circle span {
    transform: rotate(-90deg) translateY(28px);
  }

  /* backdrop-filter already set in base; no background override on mobile */
}

/* ═══ MOBILE — no per-segment GPU layers (any orientation) ═══════════════════
   The drop-shadow on .seg.hi allocates a separate GPU compositing layer per
   highlighted segment. On iPhone Safari this combined with the overlay's
   backdrop-filter tips the per-tab GPU budget — the WebContent process is
   killed and you get "a problem repeatedly occurred". This used to live
   inside the portrait media query, but landscape needs the same treatment;
   that's why the crash is landscape-only on iPhone. */
@media (max-width: 932px) {
  .seg { transition: opacity 0.14s ease; }
  .seg:hover { filter: none; }
  .seg.hi    { filter: none; opacity: 1; }
  .seg.dim   { filter: none; opacity: 0.65; }
}


/* ═══ OVERLAY BACKDROP ═══════════════════════════════════════════════════════
   Overlay is dim-only — no backdrop-filter here. The card itself carries the
   blur so it always samples the wheel directly (no stacking-context conflict). */

/* Suspend ALL backdrop-filters during orientation change so the browser can
   repaint without GPU-compositing every blur layer at once — prevents OOM crash.
   Transitions are also suppressed so backdrop-filter snaps back cleanly. */
html.resizing .icon-btn,
html.resizing #lang-menu {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
html.resizing #canvas-blur,
html.resizing #overlay,
html.resizing #help-overlay,
html.resizing #profile-overlay {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  transition: none !important;
}
html.resizing #overlay-card,
html.resizing #help-card,
html.resizing #profile-card,
html.resizing .blur-floor {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
</style>
</head>

    { mid: 'Stressed',   out: ['Overwhelmed', 'Pressured']    },
  ]},
];

/* ─── GEOMETRY ──────────────────────────────────────────────────────────── */
const W = 780, CX = W / 2, CY = W / 2;
const Ri = 72, R1 = 187, R2 = 299, R3 = 380;

const TOTAL = DATA.reduce((s, e) => s + e.secs.reduce((ss, sec) => ss + sec.out.length, 0), 0);
const dA = 360 / TOTAL;

let cur = -90;
DATA.forEach(e => {
  e.a0 = cur;
  e.secs.forEach(sec => {
    sec.a0 = cur;
    sec.outSegs = sec.out.map(() => { const seg = [cur, cur + dA]; cur += dA; return seg; });
    sec.a1 = cur;
  });
  e.a1 = cur;
});

const toRad = d => d * Math.PI / 180;

function arcPts(r, a0, a1, n = 22) {
  return Array.from({ length: n + 1 }, (_, i) => {
    const a = toRad(a0 + (a1 - a0) * i / n);
    return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
  });
}

function makeClip(r0, r1, a0, a1) {
  const outer = arcPts(r1, a0, a1);
  const inner = r0 <= 1 ? [[CX, CY]] : arcPts(r0, a1, a0);
  return 'polygon(' + [...outer, ...inner].map(([x, y]) => `${(x / W * 100).toFixed(3)}% ${(y / W * 100).toFixed(3)}%`).join(',') + ')';
}

function lighten(hex, t) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const m = v => Math.round(v + (255 - v) * t);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}

/* ─── BUILD DOM ──────────────────────────────────────────────────────────── */
const wheel   = document.getElementById('wheel');
const allSegs = [];
let currentRotation = 0;
let wheelScale = 1;

const base = document.createElement('div');
base.className = 'wheel-base';
base.style.cssText = `
  position:absolute; border-radius:50%;
  background:#fff;
  width:${R3 * 2}px; height:${R3 * 2}px;
  left:${CX - R3}px; top:${CY - R3}px;
  box-shadow: 0 6px 60px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.04);
`;
wheel.appendChild(base);

function addSeg(clip, color, meta) {
  const d = document.createElement('div');
  d.className = 'seg';
  d.style.clipPath = clip;
  d.style.background = color;
  d.dataset.t  = meta.t;
  d.dataset.ei = meta.ei ?? -1;
  d.dataset.si = meta.si ?? -1;
  d.dataset.oi = meta.oi ?? -1;
  wheel.appendChild(d);
  allSegs.push({ el: d, t: meta.t, ei: meta.ei ?? -1, si: meta.si ?? -1, oi: meta.oi ?? -1 });
}

const allLabels = [];
function addLabel(text, midR, midAngle, cls, meta, labelColor) {
  const a = toRad(midAngle);
  const x = CX + midR * Math.cos(a);
  const y = CY + midR * Math.sin(a);
  const d = document.createElement('div');
  d.className = 'lbl ' + cls;
  if (labelColor) d.style.color = labelColor;
  const span = document.createElement('span');
  span.textContent = text;
  d.appendChild(span);
  d.style.left = `${x.toFixed(1)}px`;
  d.style.top  = `${y.toFixed(1)}px`;
  wheel.appendChild(d);
  allLabels.push({ el: d, span, midAngle, en: text, ...meta });
}

function clearWheelLabel() {
  allLabels.forEach(l => {
    if (!l.el.classList.contains('sel')) return;
    l.el.classList.remove('sel');
    const arr = l.el.querySelector('.wheel-arr');
    if (arr) arr.remove();
    l.el.onclick = null;
  });
}

function decorateWheelLabel(t, EI, SI, OI) {
  clearWheelLabel();
  const lbl = allLabels.find(l => l.t === t && l.ei === EI && l.si === SI && l.oi === OI);
  if (!lbl) return;
  lbl.el.classList.add('sel');
  const arr = document.createElement('span');
  arr.className = 'wheel-arr';
  arr.textContent = ' →';
  lbl.el.appendChild(arr);
  lbl.el.onclick = () => openOverlay(_overlayName, _overlayEI);
}

function updateLabelOrientations() {
  for (let i = 0; i < allLabels.length; i++) {
    const lbl = allLabels[i];
    const visual = ((lbl.midAngle + currentRotation) % 360 + 360) % 360;
    const flip = visual > 90 && visual < 270;
    if (flip === lbl._flipped) continue; // no change — skip the DOM write
    lbl._flipped = flip;
    const rot = lbl.midAngle + (flip ? 180 : 0);
    lbl.el.style.transform = `translate(-50%,-50%) rotate(${rot.toFixed(2)}deg)`;
  }
}

DATA.forEach((e, ei) => {
  const { bg, coreText, midText, outerText, midFactor, outerFactor } = e.palette;
  const c1 = lighten(bg, midFactor);
  const c2 = lighten(bg, outerFactor);

  addSeg(makeClip(Ri, R1, e.a0, e.a1), bg, { t: 'c', ei });
  addLabel(e.core, (Ri + R1) / 2, (e.a0 + e.a1) / 2, 'lc', { t: 'c', ei, si: -1, oi: -1 }, coreText);

  e.secs.forEach((sec, si) => {
    addSeg(makeClip(R1, R2, sec.a0, sec.a1), c1, { t: 'm', ei, si });
    addLabel(sec.mid, (R1 + R2) / 2, (sec.a0 + sec.a1) / 2, 'lm', { t: 'm', ei, si, oi: -1 }, midText);

    sec.outSegs.forEach(([oa0, oa1], oi) => {
      addSeg(makeClip(R2, R3, oa0, oa1), c2, { t: 'o', ei, si, oi });
      addLabel(sec.out[oi], (R2 + R3) / 2, (oa0 + oa1) / 2, 'lo', { t: 'o', ei, si, oi }, outerText);
    });
  });
});

/* ─── RING BORDERS ───────────────────────────────────────────────────────── */
[R1, R2, R3].forEach(r => {
  const d = document.createElement('div');
  const bw = '1px';
  d.style.cssText = `
    position:absolute; border-radius:50%;
    border: ${bw} solid var(--seg-border);
    width:${r * 2}px; height:${r * 2}px;
    left:${CX - r}px; top:${CY - r}px;
    pointer-events:none; z-index:50;
    will-change:transform;
  `;
  wheel.appendChild(d);
});

/* ─── RADIAL SEPARATOR LINES ─────────────────────────────────────────────── */
const angleLevel = new Map();
DATA.forEach(e => {
  angleLevel.set(e.a0, 0);
  e.secs.forEach(sec => {
    if (!angleLevel.has(sec.a0)) angleLevel.set(sec.a0, 1);
    sec.outSegs.forEach(([a, b]) => {
      if (!angleLevel.has(a)) angleLevel.set(a, 2);
      if (!angleLevel.has(b)) angleLevel.set(b, 2);
    });
  });
});

angleLevel.forEach((level, a) => {
  const r0 = level === 0 ? Ri : level === 1 ? R1 : R2;
  const d = document.createElement('div');
  d.style.cssText = `
    position:absolute;
    width: 1px; height: ${R3 - r0}px;
    background: var(--seg-border);
    left: ${CX}px; top: ${CY - R3}px;
    transform-origin: 0.5px ${R3}px;
    transform: rotate(${(a + 90).toFixed(3)}deg);
    pointer-events: none; z-index: 50; will-change: transform;
  `;
  wheel.appendChild(d);
});


/* ─── INTERACTIONS ───────────────────────────────────────────────────────── */
let activeKey = null;

/* ─── URL / DEEP-LINK ────────────────────────────────────────────────────── */
function emotionSlug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

// slug → { t, ei, si, oi } — built once from DATA (always English)
const slugIndex = (() => {
  const idx = {};
  for (let ei = 0; ei < DATA.length; ei++) {
    const d = DATA[ei];
    idx[emotionSlug(d.core)] = { t: 'c', ei, si: -1, oi: -1 };
    for (let si = 0; si < d.secs.length; si++) {
      idx[emotionSlug(d.secs[si].mid)] = { t: 'm', ei, si, oi: -1 };
      for (let oi = 0; oi < d.secs[si].out.length; oi++) {
        const name = d.secs[si].out[oi];
        if (name) idx[emotionSlug(name)] = { t: 'o', ei, si, oi };
      }
    }
  }
  return idx;
})();

function updateURL(t, EI, SI, OI) {
  const name = t === 'c' ? DATA[EI].core
             : t === 'm' ? DATA[EI].secs[SI].mid
             :             DATA[EI].secs[SI].out[OI];
  history.replaceState(null, '', location.pathname + location.search + '#' + emotionSlug(name));
}

function clearURL() {
  history.replaceState(null, '', location.pathname + location.search);
}

function applyHighlight(EI, SI, OI, t) {
  allSegs.forEach(s => {
    let rel = false;
    if (t === 'c')      rel = s.ei === EI;
    else if (t === 'm') rel = s.ei === EI && (s.t === 'c' || s.si === SI);
    else                rel = s.ei === EI && (s.t === 'c' || (s.si === SI && (s.t === 'm' || s.oi === OI)));
    s.el.classList.toggle('hi',  rel);
    s.el.classList.toggle('dim', !rel);
  });
}

function clearAll(force = false) {
  activeKey = null;
  clearURL();
  allSegs.forEach(s => s.el.classList.remove('hi', 'dim'));
  clearWheelLabel();
  if (force) {
    overlay.classList.remove('vis', 'peek');
    overlayCard.style.transform = '';
    overlay.setAttribute('hidden', '');
    document.getElementById('canvas-blur').classList.remove('active');
  } else {
    hideOverlay();
  }
}

document.getElementById('ifeel-circle').addEventListener('click', () => { if (activeKey) clearAll(); });

let _overlayEI = 0, _overlayName = '';

function setBreadcrumb(EI, SI, OI, t) {
  const coreN = DATA[EI].core;
  const midN  = t !== 'c' ? DATA[EI].secs[SI].mid     : null;
  const outN  = t === 'o' ? DATA[EI].secs[SI].out[OI] : null;

  _overlayEI   = EI;
  _overlayName = outN ?? midN ?? coreN;

  openOverlay(_overlayName, _overlayEI);
}

updateLabelOrientations();

/* ─── ROTATION ENGINE ────────────────────────────────────────────────────── */
function setRotation(deg) {
  currentRotation = deg;
  wheel.style.transform = `translate(-50%,-50%) scale(${wheelScale}) rotate(${deg}deg)`;
  updateLabelOrientations();
}

let momentumRAF = null;
let snapRAF = null;

function cancelMotion() {
  if (momentumRAF) { cancelAnimationFrame(momentumRAF); momentumRAF = null; }
  if (snapRAF)     { cancelAnimationFrame(snapRAF);     snapRAF = null; }
}

function shortDelta(a, b) {
  let d = a - b;
  while (d > 180)  d -= 360;
  while (d < -180) d += 360;
  return d;
}

function makeEase(bounce = 0.18) {
  return t => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.45) return 4 * t * t * t / 0.364;
    const s = (t - 0.45) / 0.55;
    const c4 = (2 * Math.PI) / 2.8;
    return 1 + Math.pow(2, -9 * s) * Math.sin((s * 9 - 0.9) * c4) * bounce;
  };
}
const easeInOut = makeEase(0.18);

function animateRotationTo(targetRot, duration, onDone, ease = easeInOut) {
  cancelMotion();
  const startRot = currentRotation;
  const delta = targetRot - startRot;
  if (Math.abs(delta) < 0.01) { if (onDone) onDone(); return; }
  const startT = performance.now();
  function step(now) {
    const t = Math.min(1, (now - startT) / duration);
    setRotation(startRot + delta * ease(t));
    if (t < 1) {
      snapRAF = requestAnimationFrame(step);
    } else {
      snapRAF = null;
      if (onDone) onDone();
    }
  }
  snapRAF = requestAnimationFrame(step);
}

function snapToSeg(t, EI, SI, OI, duration = 1100, ease = easeInOut) {
  let mid;
  if (t === 'c') {
    const e = DATA[EI];
    mid = (e.a0 + e.a1) / 2;
  } else if (t === 'm') {
    const sec = DATA[EI].secs[SI];
    mid = (sec.a0 + sec.a1) / 2;
  } else {
    const oa = DATA[EI].secs[SI].outSegs[OI];
    mid = (oa[0] + oa[1]) / 2;
  }
  const target = currentRotation + shortDelta(-mid, currentRotation);
  animateRotationTo(target, duration, () => {
    activeKey = `${t}:${EI}:${SI}:${OI}`;
    updateURL(t, EI, SI, OI);
    applyHighlight(EI, SI, OI, t);
    setBreadcrumb(EI, SI, OI, t);
  }, ease);
}

function snapToNearestOuter(duration = 900, ease = easeInOut) {
  let best = null, bestDist = Infinity;
  for (const s of allSegs) {
    if (s.t !== 'o') continue;
    const oa = DATA[s.ei].secs[s.si].outSegs[s.oi];
    const mid = (oa[0] + oa[1]) / 2;
    const d = Math.abs(shortDelta(-mid, currentRotation));
    if (d < bestDist) { bestDist = d; best = s; }
  }
  if (best) snapToSeg('o', best.ei, best.si, best.oi, duration, ease);
}

// Underdamped spring from (currentRotation, v0) converging to the nearest
// outer segment. One continuous motion — no separate phases, no pause.
// Called by startMomentum when velocity drops to the handoff threshold.
function settleToNearest(v0) {
  cancelMotion();

  let best = null, bestDist = Infinity;
  for (const s of allSegs) {
    if (s.t !== 'o') continue;
    const oa = DATA[s.ei].secs[s.si].outSegs[s.oi];
    const mid = (oa[0] + oa[1]) / 2;
    const d = Math.abs(shortDelta(-mid, currentRotation));
    if (d < bestDist) { bestDist = d; best = s; }
  }
  if (!best) return;

  const oa  = DATA[best.ei].secs[best.si].outSegs[best.oi];
  const mid = (oa[0] + oa[1]) / 2;
  const targetRot = currentRotation + shortDelta(-mid, currentRotation);

  // General underdamped spring solution:
  //   offset(t) = e^(-ζω₀t) · (A·cos ωd·t + B·sin ωd·t)
  // where A and B are set by initial position offset and velocity.
  // ω₀=20, ζ=0.4: at full spin (720°/s) this yields ~24° of overshoot
  // peaking at ~65 ms — clearly visible, smooth deceleration over 4+ frames.
  // Stiffer values (32, 26) decayed too fast: <4° in <50 ms, imperceptible.
  const omega0 = 20;                                       // natural frequency (rad/s)
  const zeta   = 0.4;                                      // damping ratio — < 1 = bouncy
  const omegaD = omega0 * Math.sqrt(1 - zeta * zeta);     // damped frequency
  const x0 = currentRotation - targetRot;                  // initial offset from target
  const A  = x0;
  const B  = (v0 + zeta * omega0 * x0) / omegaD;

  const t0 = performance.now();
  function step(now) {
    const t      = (now - t0) / 1000;
    const env    = Math.exp(-zeta * omega0 * t);
    const offset = env * (A * Math.cos(omegaD * t) + B * Math.sin(omegaD * t));
    setRotation(targetRot + offset);
    if (Math.abs(offset) > 0.1) {
      snapRAF = requestAnimationFrame(step);
    } else {
      // Apply highlight at settle — same pattern as drag/click (A1/B1).
      setRotation(targetRot);
      activeKey = `o:${best.ei}:${best.si}:${best.oi}`;
      updateURL('o', best.ei, best.si, best.oi);
      applyHighlight(best.ei, best.si, best.oi, 'o');
      setBreadcrumb(best.ei, best.si, best.oi, 'o');
      snapRAF = null;
    }
  }
  snapRAF = requestAnimationFrame(step);
}

// Immediately snaps to the nearest outer segment, then bounces in place.
// amplitude = peak swing in degrees (0 = no bounce).
function snapAndBounce(amplitude = 0) {
  let best = null, bestDist = Infinity;
  for (const s of allSegs) {
    if (s.t !== 'o') continue;
    const oa = DATA[s.ei].secs[s.si].outSegs[s.oi];
    const mid = (oa[0] + oa[1]) / 2;
    const d = Math.abs(shortDelta(-mid, currentRotation));
    if (d < bestDist) { bestDist = d; best = s; }
  }
  if (!best) return;

  const oa  = DATA[best.ei].secs[best.si].outSegs[best.oi];
  const mid = (oa[0] + oa[1]) / 2;
  const targetRot = currentRotation + shortDelta(-mid, currentRotation);

  cancelMotion();
  setRotation(targetRot);

  if (amplitude < 0.5) {
    // Zero amplitude — just snap and highlight immediately.
    activeKey = `o:${best.ei}:${best.si}:${best.oi}`;
    updateURL('o', best.ei, best.si, best.oi);
    applyHighlight(best.ei, best.si, best.oi, 'o');
    setBreadcrumb(best.ei, best.si, best.oi, 'o');
    return;
  }

  // Sine-based damped oscillation: starts at 0 (no initial jump), swings
  // forward in the spin direction, then settles.  cos() was replaced by
  // sin() so offset(0) = 0 — the snap position is held for one frame
  // before the bounce arc begins, giving a smooth visual handoff.
  // Peak at π/(2·ω) ≈ 196 ms (12 frames) — clearly visible.
  const decay = 4;
  const omega = 8;
  const t0 = performance.now();
  function step(now) {
    const t = (now - t0) / 1000;
    const offset = amplitude * Math.exp(-decay * t) * Math.sin(omega * t);
    setRotation(targetRot + offset);
    if (t < 1.5 && Math.abs(offset) > 0.05) {
      snapRAF = requestAnimationFrame(step);
    } else {
      // Highlight at settle — same pattern as clicking an emotion (A1).
      setRotation(targetRot);
      activeKey = `o:${best.ei}:${best.si}:${best.oi}`;
      updateURL('o', best.ei, best.si, best.oi);
      applyHighlight(best.ei, best.si, best.oi, 'o');
      setBreadcrumb(best.ei, best.si, best.oi, 'o');
      snapRAF = null;
    }
  }
  snapRAF = requestAnimationFrame(step);
}

/* ─── DRAG / MOMENTUM ────────────────────────────────────────────────────── */
function pointerAngle(clientX, clientY) {
  const rect = wheel.getBoundingClientRect();
  const cx = rect.left + rect.width  / 2;
  const cy = rect.top  + rect.height / 2;
  return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
}

let drag = null;

function pointerDown(clientX, clientY, target) {
  if (isSpinning) stopSpin(false);
  cancelMotion();
  const a = pointerAngle(clientX, clientY);
  drag = {
    lastAngle: a,
    samples: [{ a, t: performance.now() }],
    moved: 0,
    seg: target ? target.closest('.seg') : null,
  };
  wheel.classList.add('dragging');
}

function pointerMove(clientX, clientY) {
  if (!drag) return;
  const a = pointerAngle(clientX, clientY);
  const d = shortDelta(a, drag.lastAngle);
  setRotation(currentRotation + d);
  drag.moved += Math.abs(d);
  drag.lastAngle = a;
  const now = performance.now();
  drag.samples.push({ a, t: now });
  while (drag.samples.length > 2 && now - drag.samples[0].t > 120) drag.samples.shift();
}

function pointerUp() {
  if (!drag) return;
  const ds = drag;
  drag = null;
  wheel.classList.remove('dragging');

  if (ds.moved < 4) {
    if (ds.seg) {
      const t  = ds.seg.dataset.t;
      const EI = +ds.seg.dataset.ei;
      const SI = +ds.seg.dataset.si;
      const OI = +ds.seg.dataset.oi;
      const key = `${t}:${EI}:${SI}:${OI}`;
      if (activeKey === key) {
        clearAll();
      } else {
        snapToSeg(t, EI, SI, OI);
      }
    }
    return;
  }

  const s = ds.samples;
  const last = s[s.length - 1];
  const first = s[0];
  const dt = (last.t - first.t) / 1000;
  let v = 0;
  if (dt > 0.02) {
    let total = 0;
    for (let i = 1; i < s.length; i++) total += shortDelta(s[i].a, s[i-1].a);
    v = total / dt;
  }
  // Mobile jitter can push ds.moved past 4° on what feels like a tap.
  // If the gesture was near-stationary and landed on the active segment, deselect.
  if (Math.abs(v) < 6 && ds.seg) {
    const t  = ds.seg.dataset.t;
    const EI = +ds.seg.dataset.ei;
    const SI = +ds.seg.dataset.si;
    const OI = +ds.seg.dataset.oi;
    if (`${t}:${EI}:${SI}:${OI}` === activeKey) { clearAll(); return; }
  }
  startMomentum(v);
}

function startMomentum(initialVel, friction = 1.4, onSettle = null, minSpeed = 6) {
  cancelMotion();
  let v = initialVel;
  const k = friction;
  const settle = onSettle ? v => onSettle(v) : () => snapToNearestOuter();

  if (Math.abs(v) < minSpeed) { settle(v); return; }

  let lastT = performance.now();
  function step(now) {
    const dt = (now - lastT) / 1000;
    lastT = now;
    setRotation(currentRotation + v * dt);
    v *= Math.exp(-k * dt);
    if (Math.abs(v) > minSpeed) {
      momentumRAF = requestAnimationFrame(step);
    } else {
      momentumRAF = null;
      settle(v);
    }
  }
  momentumRAF = requestAnimationFrame(step);
}

/* ─── INPUT BINDINGS ─────────────────────────────────────────────────────── */
wheel.addEventListener('mousedown', e => {
  e.preventDefault();
  pointerDown(e.clientX, e.clientY, e.target);
});
window.addEventListener('mousemove', e => { if (drag) pointerMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => pointerUp());

wheel.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  pointerDown(t.clientX, t.clientY, e.target);
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (!drag || e.touches.length !== 1) return;
  const t = e.touches[0];
  pointerMove(t.clientX, t.clientY);
}, { passive: true });
window.addEventListener('touchend',    () => pointerUp());
window.addEventListener('touchcancel', () => pointerUp());

document.addEventListener('click', e => {
  if (e.target.closest('#wheel-frame, #overlay, #help-overlay, #profile-overlay, .icon-btn')) return;
  if (activeKey) clearAll();
});

/* ─── RESPONSIVE SCALE ───────────────────────────────────────────────────── */
const frame = document.getElementById('wheel-frame');
function fitWheel() {
  const isMobilePortrait = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
  const size = isMobilePortrait
    ? window.innerWidth * 780 / 380
    : Math.min(frame.clientWidth, frame.clientHeight);
  wheelScale = parseFloat((Math.min(size, W * 4) / W).toFixed(4)); // clamp: never > 4× natural size
  frame.style.setProperty('--wheel-scale', wheelScale); // still used by #ifeel-circle sizing
  wheel.style.transform = `translate(-50%,-50%) scale(${wheelScale}) rotate(${currentRotation}deg)`;
}
// Cancel any in-progress nudge animation (called on resize to avoid stale transforms)
function cancelNudge() {
  if (overlayCard._nudgeTimer) { clearTimeout(overlayCard._nudgeTimer); overlayCard._nudgeTimer = null; }
  if (overlayCard._nudgeSB)    { overlayCard.removeEventListener('transitionend', overlayCard._nudgeSB); overlayCard._nudgeSB = null; }
  overlayCard.style.transition = '';
  overlayCard.style.transform  = '';
}

let _fitTimer    = null;
let _resizeClass = null; // tracks the 'resizing' class removal timeout

function beginResize() {
  cancelMotion();
  document.documentElement.classList.add('resizing');
  clearTimeout(_resizeClass);
  // Fallback: remove class even if the debounced resize never fires
  _resizeClass = setTimeout(() => document.documentElement.classList.remove('resizing'), 500);

function endResize() {
  fitWheel();
  cancelNudge();
  // Recalculate peek height after orientation change — the portrait value is
  // stale in landscape (and vice versa), which jams the overlay card position.
  if (!overlay.hasAttribute('hidden') && overlay.classList.contains('peek')) {
    const peekH = ovTitle.offsetTop + ovTitle.offsetHeight + 20;
    document.documentElement.style.setProperty('--peek-h', peekH + 'px');
  }
  clearTimeout(_resizeClass);
  document.documentElement.classList.remove('resizing');
}

// possible moment to kill backdrop-filters before the GPU repaints.
window.addEventListener('orientationchange', beginResize);

  beginResize();

    const now = performance.now();
    const dt  = Math.max(now - scrollLastT, 1); // ms
    scrollLastT = now;

    // Normalise deltaY across pixel / line / page modes
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 20;
    if (e.deltaMode === 2) dy *= 400;

    const delta = dy * 0.35; // degrees per normalised pixel
    setRotation(currentRotation + delta);

    // Running velocity estimate (deg/s)
    scrollVel = (delta / dt) * 1000;

    // After ~140 ms of silence, hand off to the existing momentum system
    scrollEndTimer = setTimeout(() => {
      startMomentum(scrollVel);
      scrollVel = 0;
    }, 140);
  }, { passive: false });

let _tED_lang = null;
let _tED_data = null;
function tED(name) {
  if (currentLang === 'en') return ED[name];
  if (currentLang !== _tED_lang) {
    if (!ED_TRANS[currentLang] && _ED_LOADERS[currentLang]) {
      _ED_LOADERS[currentLang]();
      delete _ED_LOADERS[currentLang];
    }
    _tED_lang = currentLang;
    _tED_data = ED_TRANS[currentLang] ?? {};
  }
  return _tED_data[name] ?? ED[name];
}

let _currentEmotion = null;
function openOverlay(name, EI, opts) {
  _currentEmotion = name;
  const expand = !!(opts && opts.expand);
  const d = tED(name) ?? { similar:[], sensations:'—', telling:'—', helping:'—' };
  const color = DATA[EI].palette.bg;
  ovBar.style.background    = color;
  ovTitle.textContent       = tEmo(name);
  ovSimilar.textContent     = d.similar.join(', ') || '—';
  ovSensations.textContent  = d.sensations;
  ovTelling.textContent     = d.telling;
  ovHelping.textContent     = d.helping;
  ovHSimilar.textContent    = tUI('similar');
  ovHSensations.textContent = tUI('sensations');
  ovHTelling.textContent    = tUI('telling');
  ovHHelping.textContent    = tUI('helping');
  // Reset share button to its idle label every time an emotion is opened —
  // a stale "Link copied" from a previous emotion would be misleading.
  if (ovShare._revertTimer) { clearTimeout(ovShare._revertTimer); ovShare._revertTimer = null; }
  ovShare.classList.remove('copied');
  ovShare.textContent = tUI('shareThisFeeling');
  updateAddButton(name);
  // Open in peek state; if already vis, keep it open to avoid collapsing mid-read
  if (overlay.hasAttribute('hidden') || (!overlay.classList.contains('vis') && !overlay.classList.contains('peek'))) {
    overlay.removeAttribute('hidden');
    // Measure title's bottom edge relative to card top — adapts to any font/padding size.
    // (Transforms don't affect offsetTop, so the off-screen card still gives correct values.)
    const overlayTitle = ovTitle;
    const peekH = overlayTitle.offsetTop + overlayTitle.offsetHeight + 20;
    document.documentElement.style.setProperty('--peek-h', peekH + 'px');
    requestAnimationFrame(() => {
      if (expand) {
        // Open straight to full view (used when launched from My emotions)
        overlay.classList.add('vis');
        setCanvasBlur(true);
      } else {
        overlay.classList.add('peek');
        // After the slide-in settles, nudge up to hint at scrollable content
        overlayCard.addEventListener('transitionend', function h(e) {
          if (e.propertyName !== 'transform') return;
          overlayCard.removeEventListener('transitionend', h);
          nudgePeek();
        });
      }
    });
  } else if (expand && overlay.classList.contains('peek')) {
    // Already showing in peek (rare path) — promote to vis
    expandOverlay();
  }
  // If already vis: content already updated above, no state change needed
}

// ─── Share button: copy current URL (carries ?lang= and #emotion-slug) ───
ovShare.addEventListener('click', async (e) => {
  // Stop propagation so clicks on the button don't bubble to the card and
  // collapse/dismiss the overlay via the sheet-drag handlers.
  e.stopPropagation();
  const url = location.href;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(url);
      ok = true;
    }
  } catch (err) { /* fall through to legacy path */ }
  if (!ok) {
    // Legacy fallback for browsers without async clipboard API
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity  = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(ta);
  }
  ovShare.classList.add('copied');
  ovShare.textContent = tUI('linkCopied');
  if (ovShare._revertTimer) clearTimeout(ovShare._revertTimer);
  ovShare._revertTimer = setTimeout(() => {
    ovShare.classList.remove('copied');
    ovShare.textContent = tUI('shareThisFeeling');
    ovShare._revertTimer = null;
  }, 2000);
});

// Brief bounce to hint that the peeked card has scrollable content below.
// Nudges up ~80 px, then springs back with the same cubic as the slide-in.
function nudgePeek() {
  // Cancel any in-progress nudge
  if (overlayCard._nudgeTimer) { clearTimeout(overlayCard._nudgeTimer); overlayCard._nudgeTimer = null; }
  if (overlayCard._nudgeSB)    { overlayCard.removeEventListener('transitionend', overlayCard._nudgeSB); overlayCard._nudgeSB = null; }

  const NUDGE = 10;

  // One up-and-back cycle. onDone (optional) is called once the spring-back ends.
  function oneNudge(onDone) {
    const peekY = overlayCard.offsetHeight - getPeekH();

    // Slide up — spring easing so it has a tiny overshoot on the way up
    overlayCard.style.transition = 'transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1)';
    overlayCard.style.transform  = `translateY(${peekY - NUDGE}px)`;

    // After slide-up: spring back with explicit duration so it's snappy
    overlayCard._nudgeSB = function(e) {
      if (e.propertyName !== 'transform') return;
      overlayCard.removeEventListener('transitionend', overlayCard._nudgeSB);
      overlayCard._nudgeSB = null;
      overlayCard.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      overlayCard.style.transform  = '';  // CSS rule (peekY) → spring fires

      // After spring-back: clean up inline overrides, then continue
      overlayCard._nudgeSB = function(e2) {
        if (e2.propertyName !== 'transform') return;
        overlayCard.removeEventListener('transitionend', overlayCard._nudgeSB);
        overlayCard._nudgeSB = null;
        overlayCard.style.transition = '';  // hand back to CSS default
        if (onDone) onDone();
      };
      overlayCard.addEventListener('transitionend', overlayCard._nudgeSB);
    };
    overlayCard.addEventListener('transitionend', overlayCard._nudgeSB);
  }

  // Brief pause so the user sees the settled peek state, then two nudges
  overlayCard._nudgeTimer = setTimeout(() => {
    overlayCard._nudgeTimer = null;
    oneNudge(null);
  }, 350);
}

function animClose(el) {
  el.classList.remove('vis');
  // Wait for the overlay's opacity transition to finish before hiding
  const h = e => {
    if (e.target !== el || e.propertyName !== 'opacity') return;
    el.setAttribute('hidden', '');
    el.removeEventListener('transitionend', h);
  };
  el.addEventListener('transitionend', h);
}

function getPeekH() {
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--peek-h'), 10);
}

function addSheetDrag(backdropEl, cardEl, collapseFn, dismissFn, expandFn) {
  // collapseFn — drag down from vis  → collapse to peek (or close for help/info)
  // dismissFn  — called after off-screen animation → state cleanup only (no animation)
  // expandFn   — drag up   from peek → expand to vis
  const handle = cardEl.querySelector('.sheet-handle');
  const DIST = 60;    // px — minimum drag distance to trigger a snap
  const VEL  = 0.4;  // px/ms — minimum flick velocity to trigger a snap

  // Blur floor: sits in the overlay (no transform) so backdrop-filter
  // correctly samples the wheel. JS updates its height during upward drag.
  const blurFloor = document.createElement('div');
  blurFloor.className = 'blur-floor';
  backdropEl.appendChild(blurFloor);

  let startY = null, lastY = null, lastT = null, vel = 0, baseY = 0, wentUp = false, moved = false;
  let fromHandle = false; // true when drag began on the handle pill (used to gate tap-collapse)
  let dragEndedAt = 0;    // timestamp — used to swallow synthetic post-drag clicks

  function getBase() {
    return backdropEl.classList.contains('peek') ? cardEl.offsetHeight - getPeekH() : 0;
  }
  function getInlineY() {
    const m = (cardEl.style.transform || '').match(/translateY\(([-\d.]+)px\)/);
    return m ? parseFloat(m[1]) : baseY;
  }

  function onStart(y, isFromHandle = false) {
    // Cancel any pending nudge hint so drag takes over cleanly
    if (cardEl._nudgeTimer) { clearTimeout(cardEl._nudgeTimer); cardEl._nudgeTimer = null; }
    if (cardEl._nudgeSB)    { cardEl.removeEventListener('transitionend', cardEl._nudgeSB); cardEl._nudgeSB = null; }
    // Note: drag only engages from the top 80 px (touch) or the .sheet-handle (mouse) —
    // both above the scrollable region — so we don't need to guard against scrollTop > 0.
    // An earlier guard here broke collapse/dismiss whenever the body had been scrolled.
    if (startY !== null) return;           // guard against double-start
    startY = lastY = y;
    lastT  = performance.now();
    vel    = 0;
    baseY  = getBase();
    wentUp = false;
    moved  = false;
    fromHandle = isFromHandle;
    cardEl.style.transition = 'none';
    cardEl.style.transform  = `translateY(${baseY}px)`;
  }

  function onMove(y) {
    if (startY === null) return;
    const now = performance.now();
    vel   = (y - lastY) / Math.max(now - lastT, 1);
    lastY = y; lastT = now;
    const dy = y - startY;
    if (dy < 0) wentUp = true;
    if (Math.abs(dy) > 5) moved = true;
    if (dy < 0 && backdropEl.classList.contains('vis')) {
      // Elastic resistance when dragging up from vis — feels native
      const upPx = Math.round(-dy * 0.2);
      cardEl.style.transform = `translateY(${-upPx}px)`;
      // Grow the blur floor to fill the gap revealed below the card
      blurFloor.style.height = upPx + 'px';
    } else {
      // Normal follow — clamp so card never goes above vis (translateY 0)
      cardEl.style.transform = `translateY(${Math.max(0, baseY + dy)}px)`;
      blurFloor.style.height = '0';
    }
  }

  // Snap to a CSS-defined state: re-enable transition then apply class change in next frame
  function settle(action) {
    dragEndedAt = performance.now();
    blurFloor.style.height = '0';
    cardEl.style.transition = '';
    requestAnimationFrame(() => {
      cardEl.style.transform = '';
      if (action) action();
    });
  }

  // Animate card off the bottom of the screen, then call onDone for state cleanup
  function slideOffScreen(fromY, onDone) {
    dragEndedAt = performance.now();
    blurFloor.style.height = '0';
    const endY = cardEl.offsetHeight;
    const dist = Math.max(endY - fromY, 1);
    const dur  = Math.max(150, Math.min(420, dist * 0.9));
    cardEl.style.transition = 'none';
    const anim = cardEl.animate(
      [{ transform: `translateY(${fromY}px)` }, { transform: `translateY(${endY}px)` }],
      { duration: dur, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
    );
    anim.onfinish = () => {
      anim.cancel();
      cardEl.style.transform  = '';
      cardEl.style.transition = '';
      if (onDone) onDone();
    };
  }

  function onEnd(y) {
    if (startY === null) return;
    const dy = y - startY;
    const v  = vel;
    startY   = null;

    const inPeek = backdropEl.classList.contains('peek');

    if (inPeek) {
      if (dy < -DIST || v < -VEL) {
        settle(expandFn);                              // swipe up  → vis
      } else if (dy > DIST || v > VEL) {
        const curY = getInlineY();                     // swipe down → off screen
        slideOffScreen(curY, () => {
          backdropEl.classList.remove('peek');
          backdropEl.setAttribute('hidden', '');
          if (dismissFn) dismissFn();
        });
      } else {
        settle();                                      // not far enough — snap back to peek
      }
    } else { // vis
      if (wentUp || dy < 0) {
        // User moved upward at ANY point → always snap back to vis, no collapse
        settle();
      } else if (!moved && fromHandle) {
        // Pure tap on the handle pill → collapse to peek
        settle(collapseFn);
      } else if (dy > DIST || v > VEL) {
        // Meaningful downward drag or fast flick → collapse to peek
        settle(collapseFn);
      } else {
        // Downward motion but not enough → snap back to vis
        settle();
      }
    }
  }

  // Touch: the whole top 80 px of the card is the drag zone — much easier on mobile.
  // We still track whether the touch began on the handle pill (for tap-to-collapse gating).
  cardEl.addEventListener('touchstart', e => {
    const t    = e.touches[0];
    const relY = t.clientY - cardEl.getBoundingClientRect().top;
    if (relY > 80) return;                              // only top strip
    onStart(t.clientY, !!e.target.closest('.sheet-handle'));
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (startY === null) return;
    e.preventDefault();
    onMove(e.touches[0].clientY);
  }, { passive: false });
  window.addEventListener('touchend', e => onEnd(e.changedTouches[0].clientY));

  // Mouse: keep the enlarged handle hit-area for desktop (precise, less critical for size).
  handle.addEventListener('mousedown', e => {
    onStart(e.clientY, true);
    const mv = ev => onMove(ev.clientY);
    const up = ev => { onEnd(ev.clientY); window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv);
    window.addEventListener('mouseup', up);
  });

  // Swallow synthetic clicks fired after a real drag (not a tap).
  // stopImmediatePropagation ensures no other document-level listener (including
  // the clearAll handler in bubbling phase) sees this event.
  document.addEventListener('click', e => {
    if (moved && performance.now() - dragEndedAt < 350) {
      e.stopImmediatePropagation();
      e.preventDefault();
    }
  }, true);
}

const overlayCard = document.getElementById('overlay-card');

const canvasBlur = document.getElementById('canvas-blur');
function setCanvasBlur(on) { canvasBlur.classList.toggle('active', on); }

function expandOverlay()   { overlay.classList.remove('peek'); overlay.classList.add('vis'); setCanvasBlur(true); }
function collapseOverlay() { overlay.classList.remove('vis');  overlay.classList.add('peek'); setCanvasBlur(false); }
function hideOverlay() {
  const inVis  = overlay.classList.contains('vis');
  const inPeek = overlay.classList.contains('peek');
  if (!inVis && !inPeek) return; // already hidden — no dangling listener

  if (inPeek) {
    // Use Web Animations API — bypasses CSS transition/specificity issues entirely.
    overlayCard.style.pointerEvents = 'none';
    const cardH  = overlayCard.offsetHeight;
    const startY = cardH - getPeekH();
    const endY   = cardH;
    const anim = overlayCard.animate(
      [{ transform: `translateY(${startY}px)` }, { transform: `translateY(${endY}px)` }],
      { duration: 480, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
    );
    anim.onfinish = () => {
      overlay.classList.remove('peek');
      overlay.setAttribute('hidden', '');
      overlayCard.style.pointerEvents = '';
      anim.cancel(); // remove fill, hand back to CSS
    };
  } else {
    // vis state: remove class → card slides to translateY(100%), backdrop fades.
    overlay.classList.remove('vis');
    setCanvasBlur(false);
    overlayCard.style.transform = '';
    overlayCard.addEventListener('transitionend', function h() {
      overlayCard.removeEventListener('transitionend', h);
      overlay.setAttribute('hidden', '');
    });
  }
}
function closeOverlay() {
  // Both peek and vis dismiss entirely — clearAll() animates the slide-down
  // (peek path uses WAAPI, vis path uses CSS transition via hideOverlay).
  clearAll();
}

// In vis state, drag-down / handle-tap now dismiss completely instead of
// collapsing to peek. Peek-state drag-down still dismisses (was already).
addSheetDrag(overlay, overlayCard, clearAll, clearAll, expandOverlay);

// Click anywhere on the peeked card to expand to full
overlayCard.addEventListener('click', () => { if (overlay.classList.contains('peek')) expandOverlay(); });

overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });

/* ─── HELP OVERLAY RENDER ────────────────────────────────────────────────── */
function renderHelpOverlay() {
  const h = HELP_DATA[currentLang] ?? HELP_DATA.en;
  const d = INFO_DATA[currentLang] ?? INFO_DATA.en;
  const isRTL = currentLang === 'ar' || currentLang === 'fa';
  document.getElementById('help-card').dir = isRTL ? 'rtl' : 'ltr';

  // Tab labels: first tab from HELP_DATA, rest from INFO_DATA
  const tabs = document.querySelectorAll('.info-tab');
  tabs[0].textContent = h.howTab ?? h.howTitle;
  tabs[1].textContent = d.tabs[0]; // about
  tabs[2].textContent = d.tabs[1]; // resources

  // Store localised title on each panel for heading updates
  const panelHow   = document.getElementById('info-panel-how');
  const panelAbout = document.getElementById('info-panel-about');
  const panelMore  = document.getElementById('info-panel-more');

  panelHow.dataset.title   = h.howTitle;
  panelAbout.dataset.title = d.purposeTitle;
  panelMore.dataset.title  = d.moreTitle;

  // Update heading to match currently active panel
  const activePanel = document.querySelector('.info-panel.active');
  document.getElementById('help-title').textContent = activePanel?.dataset.title ?? h.howTitle;

  // Rebuild how panel
  panelHow.innerHTML = h.howHTML
    ? h.howHTML
    : h.howItems.map(([k, v]) => `<p><strong>${k}</strong> — ${v}</p>`).join('');

  // Rebuild about panel: intro paras, optional science block, then personal subheading + story
  const last = d.aboutParas.length - 1;
  panelAbout.innerHTML = d.purposeParas.map(p => `<p>${p}</p>`).join('')
                       + (d.scienceTitle ? `<h3 class="info-subheading">${d.scienceTitle}</h3>` : '')
                       + (d.scienceParas ? d.scienceParas.map(p => `<p>${p}</p>`).join('') : '')
                       + `<h3 class="info-subheading">${d.aboutTitle}</h3>`
                       + d.aboutParas.slice(0, last).map(p => `<p>${p}</p>`).join('')
                       + `<p class="info-sig">${d.aboutParas[last]}</p>`;

  // Rebuild resources panel
  panelMore.innerHTML =
    '<div class="more-items">' +
    d.moreItems.map(([title, desc], i) => {
      const [url, urlText] = HELP_MORE_URLS[i];
      return `<p><strong>${title}</strong> — ${desc}<br><a href="${url}" target="_blank" rel="noopener">${urlText}</a></p>`;
    }).join('') +
    '</div>';
}

function getProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.filter(n => typeof n === 'string') : [];
  } catch (e) { return []; }
}
function setProfile(arr) {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(arr)); } catch (e) {}
  profile = arr;
  syncPersonaDot();
}
let profile = getProfile();

function syncPersonaDot() {
  profileBtn.classList.toggle('has-items', profile.length > 0);
}
syncPersonaDot();

function findEmotionIndex(name) {
  // Returns the EI (top-level core-emotion index) for any canonical name —
  // core, mid-ring, or outer-ring. Used to look up the palette colour.
  for (let i = 0; i < DATA.length; i++) {
    const d = DATA[i];
    if (d.core === name) return i;
    for (const s of d.secs) {
      if (s.mid === name) return i;
      if (s.out.includes(name)) return i;
    }
  }
  return -1;
}

function updateAddButton(name) {
  const inProfile = profile.includes(name);
  const isFull    = profile.length >= PROFILE_MAX;

  addBtn.classList.remove('show-full');
  if (addBtn._fullTimer) { clearTimeout(addBtn._fullTimer); addBtn._fullTimer = null; }

  if (inProfile) {
    addBtn.classList.add('added');
    addBtnLabel.textContent = tUI('addedToProfile');
    addBtn.disabled = true;
  } else {
    addBtn.classList.remove('added');
    addBtnLabel.textContent = tUI('addToProfile');
    addBtn.disabled = false;
  }
  addBtnFullMsg.textContent = tUI('profileFullMsg');
  // Hide button entirely if there's no current emotion (shouldn't happen, but safe)
  addBtn.style.display = name ? '' : 'none';
  // Stash full-state flag for click handler
  addBtn._isFull = isFull && !inProfile;
}

addBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!_currentEmotion) return;
  if (addBtn.classList.contains('added')) return; // already in profile
  if (addBtn._isFull) {
    // Profile full — flash inline message, do not add
    addBtn.classList.add('show-full');
    if (addBtn._fullTimer) clearTimeout(addBtn._fullTimer);
    addBtn._fullTimer = setTimeout(() => {
      addBtn.classList.remove('show-full');
      addBtn._fullTimer = null;
    }, 2400);
    return;
  }
  if (!profile.includes(_currentEmotion)) {
    setProfile([...profile, _currentEmotion]);
  }
  updateAddButton(_currentEmotion);
});

function removeFromProfile(name) {
  setProfile(profile.filter(n => n !== name));
  renderProfileOverlay();
  // If the emotion overlay is currently showing the removed emotion, re-sync its add button
  if (_currentEmotion && !overlay.hasAttribute('hidden')) {
    updateAddButton(_currentEmotion);
  }
}

function renderProfileOverlay() {
  profileTitle.textContent = tUI('myEmotions');
  if (profile.length === 0) {
    profileBody.innerHTML = `<p class="profile-empty">${tUI('myEmotionsEmpty')}</p>`;
    return;
  }
  const rows = profile.map(name => {
    const EI = findEmotionIndex(name);
    const color = EI >= 0 ? DATA[EI].palette.bg : 'transparent';
    return `
      <div class="profile-row" data-name="${name.replace(/"/g, '&quot;')}">
        <span class="swatch" style="background:${color}"></span>
        <span class="name">${tEmo(name)}</span>
        <button class="remove" type="button" aria-label="Remove">×</button>
      </div>`;
  }).join('');
  profileBody.innerHTML = `<div class="profile-list">${rows}</div>`;
}

// Delegate row remove clicks + row clicks (open emotion)
profileBody.addEventListener('click', e => {
  // Remove button takes priority
  const removeBtn = e.target.closest('.remove');
  if (removeBtn) {
    e.stopPropagation();
    const row = removeBtn.closest('.profile-row');
    if (row) removeFromProfile(row.dataset.name);
    return;
  }
  // Row click → open the corresponding emotion overlay
  const row = e.target.closest('.profile-row');
  if (!row) return;
  const name = row.dataset.name;
  const EI = findEmotionIndex(name);
  if (EI < 0) return;
  switchToOverlay(() => openOverlay(name, EI, { expand: true }));
});

function openProfile() {
  renderProfileOverlay();
  profileOverlay.removeAttribute('hidden');
  requestAnimationFrame(() => { profileOverlay.classList.add('vis'); setCanvasBlur(true); });
}
function closeProfile() { setCanvasBlur(false); animClose(profileOverlay); }

/* Smoothly hand off from one bottom-sheet card to another:
   1. Animate the current overlay's card down (reuses each overlay's own
      close path — clearAll() / closeHelp() / closeProfile()).
   2. Keep the canvas blur on across the swap so the wheel doesn't flicker.
   3. Wait for the slide-down to clear, then call openFn() to slide the new
      card up. Delay matches the 0.38 s card transform transition.
*/
const SWITCH_DELAY = 380;
function switchToOverlay(openFn) {
  const isEmotionOpen = !overlay.hasAttribute('hidden');
  const isHelpOpen    = !helpOverlay.hasAttribute('hidden');
  const isProfileOpen = !profileOverlay.hasAttribute('hidden');

  if (!isEmotionOpen && !isHelpOpen && !isProfileOpen) {
    openFn();
    return;
  }

  if (isEmotionOpen) clearAll();           // animated dismiss (peek or vis)
  if (isHelpOpen)    closeHelp();
  if (isProfileOpen) closeProfile();

  // Each close just toggled blur off — re-enable in the same frame so
  // the class is effectively never removed and the wheel doesn't flicker.
  setCanvasBlur(true);

  setTimeout(openFn, SWITCH_DELAY);
}

profileBtn.addEventListener('click', () => switchToOverlay(openProfile));
profileOverlay.addEventListener('click', e => { if (e.target === profileOverlay) closeProfile(); });
addSheetDrag(profileOverlay, profileCard, closeProfile);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!overlay.hasAttribute('hidden'))         closeOverlay();
    if (!helpOverlay.hasAttribute('hidden'))     closeHelp();
    if (!profileOverlay.hasAttribute('hidden'))  closeProfile();
    if (langMenuOpen) closeLangMenu();
  }
});

/* ─── AUTO-SPIN ──────────────────────────────────────────────────────────── */
const spinBtn  = document.getElementById('spin-btn');
const spinPlay = document.getElementById('spin-play');
const spinStop = document.getElementById('spin-stop');
let spinRAF      = null;
let isSpinning   = false;
let spinCurrentV = 0; // deg/s — live velocity, updated each frame

// Velocity profile: v(t) = PEAK_V · sin(π·t/T)
// → zero at start and end, maximum at midpoint (t = T/2)
// Integrated position: θ(t) = startAngle + PEAK_V·T/π · (1 − cos(π·t/T))
// Total rotation over full 5 s: PEAK_V · 2T/π ≈ 7.3 full revolutions at 720 deg/s peak
const SPIN_DURATION = 5000; // ms
const SPIN_PEAK_V   = 720;  // deg/s at peak — ~2 rev/s

function stopSpin(snap = true) {
  if (!isSpinning) return;
  isSpinning = false;
  if (spinRAF) { cancelAnimationFrame(spinRAF); spinRAF = null; }
  spinPlay.style.display = '';
  spinStop.style.display = 'none';
  spinBtn.setAttribute('aria-label', 'Spin circle');
  if (snap) {
    // ratio = 0 → wheel nearly stopped, ratio = 1 → stopped at peak speed
    const ratio = Math.min(Math.abs(spinCurrentV) / SPIN_PEAK_V, 1);
    snapAndBounce(16 * ratio); // 0 – 16 degrees of bounce amplitude
  }
  spinCurrentV = 0;
}

function startSpin() {
  isSpinning = true;
  clearAll();
  cancelMotion();
  spinPlay.style.display = 'none';
  spinStop.style.display = '';
  spinBtn.setAttribute('aria-label', 'Stop spinning');
  const T          = SPIN_DURATION / 1000;
  const startAngle = currentRotation;
  const t0         = performance.now();
  function step(now) {
    const elapsed = (now - t0) / 1000;
    if (elapsed >= T) { stopSpin(true); return; }
    spinCurrentV = SPIN_PEAK_V * Math.sin(Math.PI * elapsed / T);
    setRotation(startAngle + SPIN_PEAK_V * T / Math.PI * (1 - Math.cos(Math.PI * elapsed / T)));
    spinRAF = requestAnimationFrame(step);
  }
  spinRAF = requestAnimationFrame(step);
}

spinBtn.addEventListener('click', () => {
  isSpinning ? stopSpin(true) : startSpin();
});

      ['Atlas of Emotions',     'نقشه تعاملی حالات عاطفی پل اکمن، ساخته شده با دالای‌لاما'],
      ['Affect Labelling',      'تحقیق اصلی که نشان می‌دهد نام‌گذاری احساسات فعال‌شدن آمیگدال را کاهش می‌دهد (لیبرمن و همکاران، ۲۰۰۷)'],
      ['Emotional Granularity', 'بارت و همکاران درباره اهمیت تمایز میان حالات عاطفی برای بهزیستی'],
    ],
  },
};

/* Update all wheel label text spans */
function updateWheelLabels() {
  allLabels.forEach(l => {
    if (!l.el.classList.contains('sel')) l.span.textContent = tEmo(l.en);
  });
}

/* ─── THEME ──────────────────────────────────────────────────────────────── */
const _osDark = window.matchMedia('(prefers-color-scheme: dark)');

let currentTheme = _osDark.matches ? 'dark' : 'light';

function setTheme(t) {
  currentTheme = t;
  if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else               document.documentElement.removeAttribute('data-theme');
  document.getElementById('theme-icon').textContent = t === 'dark' ? '☀' : '☾';
}

// Live-update when the OS preference changes
_osDark.addEventListener('change', e => setTheme(e.matches ? 'dark' : 'light'));

document.getElementById('theme-btn').addEventListener('click', () => {
  setTheme(currentTheme === 'dark' ? 'light' : 'dark');
});

setTheme(currentTheme);

let currentLang = 'en';
let langMenuOpen = false;
const langBtn   = document.getElementById('lang-btn');
const langMenu  = document.getElementById('lang-menu');
const ifeelSpan = document.querySelector('#ifeel-circle span');

function openLangMenu() {
  langMenuOpen = true;
  langBtn.classList.add('open');
  langMenu.classList.add('open');
}
function closeLangMenu() {
  langMenuOpen = false;
  langBtn.classList.remove('open');
  langMenu.classList.remove('open');
}
function toggleLangMenu(e) {
  e.stopPropagation();
  langMenuOpen ? closeLangMenu() : openLangMenu();
}

function setLanguage(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir  = (lang === 'ar' || lang === 'fa') ? 'rtl' : 'ltr';
  const d = LANG_DATA[lang] ?? LANG_DATA.en;
  ifeelSpan.textContent = d.feel;
  updateWheelLabels();
  if (activeKey) {
    const parts = activeKey.split(':');
    const t = parts[0], EI = +parts[1], SI = +parts[2], OI = +parts[3];
    setBreadcrumb(EI, SI, OI, t);
  }
  document.querySelectorAll('.lang-opt').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.lang === lang);
  });
  if (!helpOverlay.hasAttribute('hidden')) renderHelpOverlay();
  if (!profileOverlay.hasAttribute('hidden')) renderProfileOverlay();
  profileBtn.setAttribute('aria-label', tUI('myEmotions'));
  // Re-sync the add button label if an emotion is currently displayed
  if (_currentEmotion && !overlay.hasAttribute('hidden')) updateAddButton(_currentEmotion);
  // persist language in URL search param (?lang=xx); omit for default English
  const _url = new URL(location.href);
  if (lang === 'en') { _url.searchParams.delete('lang'); }
  else               { _url.searchParams.set('lang', lang); }
  history.replaceState(null, '', _url.toString());
  closeLangMenu();
}

langBtn.addEventListener('click', toggleLangMenu);

document.querySelectorAll('.lang-opt').forEach(opt => {
  opt.addEventListener('click', e => {
    e.stopPropagation();
    setLanguage(opt.dataset.lang);
  });
});

document.addEventListener('click', () => { if (langMenuOpen) closeLangMenu(); });

/* ─── DEEP-LINK ON LOAD ──────────────────────────────────────────────────── */
(function applyHashOnLoad() {
  // restore language first so wheel labels and breadcrumb render in the right locale
  const langParam = new URLSearchParams(location.search).get('lang');
  if (langParam && LANG_DATA[langParam]) setLanguage(langParam);

  const slug = location.hash.slice(1); // strip leading '#'
  if (!slug) return;
  const entry = slugIndex[slug];
  if (!entry) return;
  snapToSeg(entry.t, entry.ei, entry.si, entry.oi, 600);
})();

/* ─── FIRST-VISIT INTRO HINT ─────────────────────────────────────────────────
   Single localStorage flag (cof-hint-seen) — show once ever, then never again.
   Auto-dismisses on the very first pointerdown anywhere on the document
   (tapping a segment, dragging the wheel, opening any menu — all count). */
(function showIntroHint() {
  const FLAG = 'cof-hint-seen';
  let stored = null;
  try { stored = localStorage.getItem(FLAG); } catch (e) { /* private mode etc. */ }
  if (stored) return;

  const hint = document.getElementById('intro-hint');
  if (!hint) return;
  hint.querySelector('span').textContent = tUI('dragOrTapToExplore');
  hint.removeAttribute('hidden');

  // Slight delay so the page has settled visually before the hint slides in.
  setTimeout(() => hint.classList.add('vis'), 400);

  function dismiss() {
    hint.classList.remove('vis');
    const onEnd = (e) => {
      if (e.propertyName !== 'opacity') return;
      hint.removeEventListener('transitionend', onEnd);
      hint.setAttribute('hidden', '');
    };
    hint.addEventListener('transitionend', onEnd);
    try { localStorage.setItem(FLAG, '1'); } catch (e) { /* ignore */ }
  }
  document.addEventListener('pointerdown', dismiss, { once: true });
})();
</script>
